name: sigpro

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  image: sigpro/php:dev
  volumes:
    - ./:/var/www/html
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgis
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_CLIENT: predis
    REVERB_SERVER_HOST: 0.0.0.0
    # Le serveur PHP publie vers Reverb sur le réseau interne ;
    # le navigateur, lui, utilise REVERB_HOST/PORT du .env (localhost).
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    COLLABORA_INTERNAL_URL: http://collabora:9980
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    postgis:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php

  web:
    image: nginx:1.27-alpine
    ports:
      - "${FORWARD_WEB_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=300

  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${FORWARD_REVERB_PORT:-8080}:8080"

  postgis:
    # Image multi-architecture (amd64 + arm64) maintenue par l'équipe docker-postgis.
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sigpro}
      POSTGRES_USER: ${DB_USERNAME:-sigpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./docker/postgis/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collabora:
    image: collabora/code:latest
    cap_add:
      - MKNOD
    environment:
      # Hôte WOPI autorisé : l'application vue depuis le conteneur Collabora.
      aliasgroup1: ${COLLABORA_WOPI_HOST:-http://web:80}
      username: ${COLLABORA_ADMIN_USER:-admin}
      password: ${COLLABORA_ADMIN_PASSWORD:-admin}
      dictionaries: fr_FR en_US
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:net.frame_ancestors=${COLLABORA_FRAME_ANCESTORS:-localhost:*}
    # Pas de healthcheck : l'image ne contient ni shell ni curl.
    # Vérification manuelle : http://localhost:9980/hosting/discovery
    ports:
      - "${FORWARD_COLLABORA_PORT:-9980}:9980"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"

volumes:
  postgis-data:
  redis-data:
